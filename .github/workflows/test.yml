name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.27 patch release: go.mod's go line is only the
          # floor, and standard-library fixes ship in patch releases.
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Tools the Action tests need
        # internal/actiontest runs action.yml's steps, which use jq and bc.
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v bc >/dev/null || sudo apt-get install -y bc

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test -count=1 ./...

  race:
    name: Race detector (loader, batch diff, Action)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.27 patch release: go.mod's go line is only the
          # floor, and standard-library fixes ship in patch releases.
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Tools the Action tests need
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v bc >/dev/null || sudo apt-get install -y bc

      - name: Test with -race
        # The race detector needs cgo; the code under test still loads with
        # CGO_ENABLED=0, which the loader sets for go list itself.
        run: CGO_ENABLED=1 go test -race -count=1 ./pkg/diff/... ./pkg/api/... ./internal/actiontest/...
