name: Vulnerability check

# Known vulnerabilities in the code and the modules it reaches. The weekly run
# catches advisories published after a change was merged.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.27 patch release: go.mod's go line is only the
          # floor, and standard-library fixes ship in patch releases.
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: govulncheck
        # Fails when the code reaches a vulnerable symbol. Pinned to a release
        # at least two weeks old; raise it deliberately, not with @latest.
        run: CGO_ENABLED=0 go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
