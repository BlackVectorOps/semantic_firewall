name: Vulnerability check

# Known vulnerabilities in the code and the modules it reaches. The weekly run
# catches advisories published after a change was merged.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.27 patch release: go.mod's go line is only the
          # floor, and standard-library fixes ship in patch releases.
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: govulncheck
        # Fails when the code reaches a vulnerable symbol. Pinned to a release
        # at least two weeks old; raise it deliberately, not with @latest.
        run: CGO_ENABLED=0 go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
