name: Semantic Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  analysis:
    name: Run Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.27 patch release, at least what go.mod requires: sfw
          # runs the loader with GOTOOLCHAIN=local, so an older toolchain
          # can't auto-upgrade and `go list` refuses.
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Build SFW
        # Built from this commit's source, outside the checkout, and put on
        # PATH, where the Action below takes it instead of installing a
        # release.
        run: |
          mkdir -p "$RUNNER_TEMP/sfw-bin"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/sfw-bin/sfw" ./cmd/sfw
          "$RUNNER_TEMP/sfw-bin/sfw" version
          echo "$RUNNER_TEMP/sfw-bin" >> "$GITHUB_PATH"

      # The repository's own Action, in diff mode: it picks the base, pairs
      # every changed file (deleted and moved ones included) and annotates
      # high-risk changes. sfw's own changes add exec and sandbox calls on
      # purpose, so high-risk changes are reported, not failed on.
      - name: Run Semantic Firewall
        id: sfw
        uses: ./
        with:
          mode: diff
          go-version: '1.27'
          fail-on-alert: 'false'

      # A pull request labeled 'semantic-safe' claims to preserve behavior:
      # any function not preserved, or any unanalyzed change, fails it.
      - name: Enforce semantic-safe
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'semantic-safe') }}
        env:
          RESULT_FILE: ${{ steps.sfw.outputs.result-file }}
        run: |
          set -euo pipefail
          if ! jq -e 'all(.[]; ((.functions // []) | all(.status == "preserved")) and ((.unanalyzed // []) | length == 0))' "$RESULT_FILE" >/dev/null; then
            echo "::error::Logic changed in a pull request labeled 'semantic-safe'."
            exit 1
          fi

      - name: Publish Analysis Report
        if: always()
        env:
          # The file, not the result itself: one environment variable holds
          # at most 128 KiB.
          RESULT_FILE: ${{ steps.sfw.outputs.result-file }}
          MATCH_PCT: ${{ steps.sfw.outputs.semantic-match-pct }}
          HIGH_RISK: ${{ steps.sfw.outputs.high-risk-changes }}
        run: |
          {
            echo "## Semantic Analysis Report"
            echo "Semantic match: ${MATCH_PCT:-n/a}%. High-risk changes: ${HIGH_RISK:-n/a}."
            echo
            echo "| File | Preserved | Modified | Added | Removed |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
            # Names come from the change: keep them from breaking the table.
            { [[ -f "${RESULT_FILE:-}" ]] && cat "$RESULT_FILE" || echo '[]'; } | jq -r '.[]? | (if .new_file == "/dev/null" then .old_file else .new_file end | gsub("[|`\r\n]"; "_")) as $f
              | "| `\($f)` | \(.summary.preserved // 0) | \(.summary.modified // 0) | \(.summary.added // 0) | \(.summary.removed // 0) |"' || true
          } >> "$GITHUB_STEP_SUMMARY"
