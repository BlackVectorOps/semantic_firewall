# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Semantic Firewall'
description: 'Behavioral analysis engine for Go. Detects malware, proves loop equivalence, and enforces semantic immutability.'
author: 'BlackVectorOps'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to file or directory to analyze'
    required: false
    default: '.'
  mode:
    description: 'Operation mode: check, diff, deps, scan, or audit'
    required: false
    default: 'check'
  go-version:
    description: 'Go version to use (sfw v7 requires Go 1.27.2+)'
    required: false
    default: '1.27'
  signatures:
    description: 'Path to signature database (scan mode only). Required for scan mode.'
    required: false
    default: ''
  threshold:
    description: 'Match confidence threshold 0.0-1.0 (scan mode only)'
    required: false
    default: '0.75'
  strict:
    description: 'Enable strict mode validation (check mode only)'
    required: false
    default: 'false'
  fail-on-alert:
    description: 'Fail workflow if malware is detected (scan mode) or a change is high-risk (diff and deps modes): true or false'
    required: false
    default: 'true'
  scan-deps:
    description: 'Scan imported dependencies (scan mode only)'
    required: false
    default: 'false'
  deps-depth:
    description: 'Dependency scan depth: direct or transitive (scan mode only)'
    required: false
    default: 'direct'
  api-key:
    description: 'LLM API Key (audit mode only). Required for intent verification.'
    required: false
  model:
    description: 'LLM model to use (audit mode only): claude-* (default), gpt-*, or gemini-*. The api-key must belong to that provider.'
    required: false
    default: 'claude-opus-5-5'
  api-base:
    description: 'Custom LLM API Base URL (audit mode only).'
    required: false

outputs:
  result:
    description: 'JSON output from the selected mode'
    value: ${{ steps.run-sfw.outputs.result }}
  alert-count:
    description: 'Number of malware alerts (scan mode)'
    value: ${{ steps.run-sfw.outputs.alert-count }}
  deps-scanned:
    description: 'Number of dependency functions scanned (scan mode with --deps)'
    value: ${{ steps.run-sfw.outputs.deps-scanned }}
  semantic-match-pct:
    description: 'Semantic match percentage (diff mode)'
    value: ${{ steps.run-sfw.outputs.semantic-match-pct }}
  audit-verdict:
    description: 'Final audit verdict (audit mode): PASS or FAIL'
    value: ${{ steps.run-sfw.outputs.audit-verdict }}
  high-risk-changes:
    description: 'Number of high-risk changes (diff and deps modes)'
    value: ${{ steps.run-sfw.outputs.high-risk-changes }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ inputs.go-version }}

    # IMPORTANT: Caller must use actions/checkout with fetch-depth: 0 for diff/audit/deps modes
    - name: Validate Checkout Depth
      if: ${{ inputs.mode == 'diff' || inputs.mode == 'audit' || inputs.mode == 'deps' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "::error::Insufficient git history. Please use 'actions/checkout' with 'fetch-depth: 0' for diff/audit/deps modes."
          exit 1
        fi

    - name: Install sfw
      shell: bash
      env:
        SFW_VERSION: "v7.3.0"
      run: |
        set -euo pipefail
        
        if command -v sfw &>/dev/null; then
          echo "::notice::sfw already installed: $(sfw version 2>/dev/null || echo 'version unknown')"
          exit 0
        fi
        
        echo "::notice::Installing sfw ${SFW_VERSION}..."
        
        MAX_RETRIES=3
        RETRY_DELAY=5
        
        for attempt in $(seq 1 $MAX_RETRIES); do
          if go install "github.com/BlackVectorOps/semantic_firewall/v7/cmd/sfw@${SFW_VERSION}"; then
            break
          fi
          
          if [[ $attempt -eq $MAX_RETRIES ]]; then
            echo "::error::Failed to install sfw after ${MAX_RETRIES} attempts."
            exit 1
          fi
          sleep $RETRY_DELAY
        done
        
        if ! command -v sfw &>/dev/null; then
          echo "::error::sfw binary not found in PATH after installation."
          exit 1
        fi

    - name: Prepare Analysis Environment
      id: prep
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        if [[ "$INPUT_MODE" != "diff" ]] && [[ "$INPUT_MODE" != "audit" ]] && [[ "$INPUT_MODE" != "deps" ]]; then
          exit 0
        fi

        # Every failure to find the base fails the job: a base that is
        # missing or wrong would analyze nothing, or the wrong changes.
        fail() { local m="$*"; m=${m//%/%25}; m=${m//$'\r'/%0D}; m=${m//$'\n'/%0A}; echo "::error::${m}"; exit 1; }
        is_sha() { [[ "$1" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] && [[ ! "$1" =~ ^0+$ ]]; }
        have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
        # A commit by hash, from origin or else the repository the workflow
        # runs in: a checkout of a fork's head has the fork as origin. The
        # hash names the commit, wherever it comes from.
        fetch_sha() {
          have "$1" && return 0
          git fetch -q --no-tags origin "$1" >/dev/null 2>&1 || true
          have "$1" && return 0
          if [[ -n "${GITHUB_SERVER_URL:-}" && -n "${GITHUB_REPOSITORY:-}" ]]; then
            git fetch -q --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$1" >/dev/null 2>&1 || true
          fi
          have "$1"
        }
        # Fully qualified, so a tag of the same name is never taken for the
        # branch.
        fetch_branch() { [[ -n "$1" ]] && git fetch -q --no-tags origin "+refs/heads/$1:refs/remotes/origin/$1"; }
        # The one best common ancestor of $1 and HEAD. A criss-cross history
        # has several, and a diff from any one of them can miss what the
        # merge changes.
        single_merge_base() {
          local bases
          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || return 1
          bases=$(git merge-base --all "$1" HEAD) || return 1
          [[ -n "$bases" && "$bases" != *$'\n'* ]] || return 1
          printf '%s' "$bases"
        }

        HEAD_SHA=$(git rev-parse --verify 'HEAD^{commit}')
        # Set when HEAD may be its own base: a push that adds nothing.
        SAME_OK=false
        case "${GITHUB_EVENT_NAME:-}" in
          pull_request|pull_request_target)
            # The base comes from the event, never from a branch of the
            # repository the checkout calls origin, which can be a fork.
            is_sha "${PR_HEAD_SHA:-}" || fail "The event has no pull request head commit."
            is_sha "${PR_BASE_SHA:-}" || fail "The event has no pull request base commit."
            git merge-base --is-ancestor "$PR_HEAD_SHA" HEAD 2>/dev/null ||
              fail "HEAD does not contain the pull request head ${PR_HEAD_SHA}. Check out the pull request's merge or head commit."
            fetch_sha "$PR_BASE_SHA" || fail "Cannot fetch the pull request's base commit ${PR_BASE_SHA}."
            if [[ "$(git rev-parse -q --verify 'HEAD^2^{commit}' || true)" == "$PR_HEAD_SHA" ]] &&
               [[ "$(git rev-parse -q --verify 'HEAD^1^{commit}' || true)" == "$PR_BASE_SHA" ]]; then
              # GitHub's merge commit of the head onto the base.
              BASE=$PR_BASE_SHA
            else
              BASE=$(single_merge_base "$PR_BASE_SHA") ||
                fail "HEAD and the pull request's base ${PR_BASE_SHA} have no single merge base. Use fetch-depth: 0, or check out the merge commit."
            fi
            ;;
          merge_group)
            { is_sha "${MG_BASE_SHA:-}" && fetch_sha "$MG_BASE_SHA"; } || fail "Cannot resolve the merge group base ${MG_BASE_SHA:-}."
            [[ "$HEAD_SHA" == "${MG_HEAD_SHA:-}" ]] || fail "HEAD is not the merge group head ${MG_HEAD_SHA:-}."
            BASE=$MG_BASE_SHA
            ;;
          push)
            if is_sha "${GITHUB_EVENT_BEFORE:-}" && fetch_sha "$GITHUB_EVENT_BEFORE"; then
              BASE=$GITHUB_EVENT_BEFORE
            else
              # A new branch, a tag, or a force push whose old tip is gone:
              # compare with the default branch, not just the last commit. A
              # stale local copy of it only widens the comparison.
              if ! fetch_branch "${DEFAULT_BRANCH:-}" 2>/dev/null; then
                have "refs/remotes/origin/${DEFAULT_BRANCH:-}" ||
                  fail "The push has no before commit and the default branch cannot be fetched."
                echo "::warning::Cannot fetch ${DEFAULT_BRANCH}; comparing with the checkout's copy of it."
              fi
              BASE=$(single_merge_base "refs/remotes/origin/$DEFAULT_BRANCH") ||
                fail "HEAD and ${DEFAULT_BRANCH} have no single merge base. Use fetch-depth: 0."
              echo "::notice::The push has no usable before commit; comparing with ${DEFAULT_BRANCH}."
              # A new branch or tag already on the default branch adds
              # nothing to compare. A force push whose before is gone does
              # not get that pass: the default branch may already hold it.
              if [[ "${GITHUB_EVENT_BEFORE:-}" =~ ^0+$ ]]; then SAME_OK=true; fi
            fi
            ;;
          *)
            BASE=$(git rev-parse -q --verify 'HEAD~1^{commit}') || fail "HEAD has no parent to compare with."
            ;;
        esac
        [[ "$BASE" != "$HEAD_SHA" || "$SAME_OK" == true ]] || fail "The base is HEAD itself (${BASE}); there is nothing to compare."
        echo "base_sha=${BASE}" >> "$GITHUB_OUTPUT"

        # Scratch files live outside the checkout: the change being analyzed
        # controls every path in it, symlinks included.
        WORK=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/sfw.XXXXXXXX")
        echo "work_dir=${WORK}" >> "$GITHUB_OUTPUT"
        WORKTREE_DIR="$WORK/base"
        git worktree prune
        git worktree add -q --detach "$WORKTREE_DIR" "$BASE" >/dev/null || fail "Cannot check out the base ${BASE}."
        echo "worktree_dir=${WORKTREE_DIR}" >> "$GITHUB_OUTPUT"

        # -z everywhere: without it git quotes unusual names ("p/\303\251.go"),
        # and the suffix tests miss them.
        DIFF_STREAM_FILE="$WORK/diff.bin"
        # --ignore-submodules=none: the change's own .gitmodules could
        # otherwise hide a submodule with ignore = all.
        git diff -z --raw --no-abbrev --no-ext-diff --ignore-submodules=none "$BASE" "$HEAD_SHA" > "$DIFF_STREAM_FILE" || fail "git diff ${BASE} ${HEAD_SHA} failed."
        TREE_FILE="$WORK/tree.bin"
        git ls-tree -r -z --full-tree "$HEAD_SHA" > "$TREE_FILE" || fail "git ls-tree ${HEAD_SHA} failed."
        NAMES_FILE="$WORK/names.bin"
        # --no-renames, so a go.mod renamed away counts by its old name.
        git diff -z --no-ext-diff --no-renames --ignore-submodules=none --name-only "$BASE" "$HEAD_SHA" > "$NAMES_FILE" || fail "git diff ${BASE} ${HEAD_SHA} failed."
        # grep -c prints 0 and exits 1 when nothing matches; `|| true` keeps
        # that single 0. A go.work redirects modules like a replace does, so
        # its changes count too.
        MOD_FILE_COUNT=$(tr '\0' '\n' < "$NAMES_FILE" | grep -cE '(^|/)go\.(mod|sum|work|work\.sum)$' || true)
        if [[ "$MOD_FILE_COUNT" -gt 0 ]]; then
          echo "has_mod_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_mod_changes=false" >> "$GITHUB_OUTPUT"
        fi

        # The old/new pairs diff and audit analyze: every changed file but Go
        # tests, vendored and generated files included. sfw diffs the Go
        # files and, with --non-go, reports the other files the build uses
        # (assembly, C, objects, embedded files). The status letter, not the
        # file system, says which sides exist, and /dev/null stands for an
        # absent one, so a deleted file is compared with nothing. A rename
        # stays one pair only within a directory, with both names in scope
        # and both Go or both not; otherwise it is a deletion plus an
        # addition, so a file moved out of the build (foo_test.go,
        # foo.go.bak, another directory) reads as removed.
        is_go() { [[ "$1" == *.go ]]; }
        in_scope() { [[ "$1" != *_test.go ]]; }
        same_kind() { if is_go "$1"; then is_go "$2"; else ! is_go "$2"; fi; }
        dir_of() { if [[ "$1" == */* ]]; then printf '%s' "${1%/*}"; else printf '.'; fi; }
        PAIRS_FILE="$WORK/pairs.bin"
        : > "$PAIRS_FILE"
        PAIR_COUNT=0
        declare -A PAIRED=()
        pair() {
          printf '%s\0%s\0' "$1" "$2" >> "$PAIRS_FILE"
          PAIR_COUNT=$((PAIR_COUNT + 1))
          if [[ "$2" != /dev/null ]]; then PAIRED["$2"]=1; fi
        }
        old_side() { if in_scope "$1"; then pair "$WORKTREE_DIR/$1" /dev/null; fi; }
        new_side() { if in_scope "$1"; then pair /dev/null "$1"; fi; }
        # A submodule's code can't be paired file by file; the run step
        # reports each changed one as a change sfw could not analyze.
        GITLINKS_FILE="$WORK/gitlinks.bin"
        : > "$GITLINKS_FILE"
        GITLINK_COUNT=0
        # --raw entries: ":<old mode> <new mode> <old hash> <new hash> <status>",
        # then one path, or two for a rename or copy.
        while IFS= read -r -d '' header; do
          read -r omode nmode _ _ status <<< "${header#:}"
          case "$status" in
            R*|C*) IFS= read -r -d '' o; IFS= read -r -d '' n ;;
            *) IFS= read -r -d '' o; n=$o ;;
          esac
          if [[ "$omode" == 160000 || "$nmode" == 160000 ]]; then
            printf '%s\0' "$n" >> "$GITLINKS_FILE"
            GITLINK_COUNT=$((GITLINK_COUNT + 1))
            continue
          fi
          case "$status" in
            A) new_side "$n" ;;
            D) old_side "$o" ;;
            M|T) if in_scope "$n"; then pair "$WORKTREE_DIR/$o" "$n"; fi ;;
            R*)
              if in_scope "$o" && in_scope "$n" && [[ "$(dir_of "$o")" == "$(dir_of "$n")" ]] && same_kind "$o" "$n"; then
                pair "$WORKTREE_DIR/$o" "$n"
              else
                old_side "$o"; new_side "$n"
              fi
              ;;
            # A copy leaves its source in place.
            C*) new_side "$n" ;;
            *) fail "Unexpected git diff status '${status}'." ;;
          esac
        done < "$DIFF_STREAM_FILE"
        # A .go symbolic link compiles whatever it points to, which can
        # change while the link does not: pair every such link the two trees
        # share that is not paired already.
        while IFS= read -r -d '' entry; do
          p=${entry#*$'\t'}
          if [[ "${entry%% *}" == 120000 ]] && is_go "$p" && in_scope "$p" && [[ -z "${PAIRED[$p]:-}" ]] &&
             git cat-file -e "${BASE}:${p}" 2>/dev/null; then
            pair "$WORKTREE_DIR/$p" "$p"
          fi
        done < "$TREE_FILE"
        echo "pairs_file=${PAIRS_FILE}" >> "$GITHUB_OUTPUT"
        echo "pair_count=${PAIR_COUNT}" >> "$GITHUB_OUTPUT"
        echo "gitlinks_file=${GITLINKS_FILE}" >> "$GITHUB_OUTPUT"
        echo "gitlink_count=${GITLINK_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Install gVisor (runsc)
      shell: bash
      run: |
        set -e
        if command -v runsc &> /dev/null; then
          exit 0
        fi
        GVISOR_VERSION="20260126.0"
        ARCH=$(uname -m)
        URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_VERSION}/${ARCH}"
        EXPECTED_SHA="cce974fa832c50d26c6ccc08ce50b4972921cd0818ebe8007587211d360cbc828ceea4ec8296703200afa208b679437d24f27a6dca31887b3c0fc6ee8be5eb05"
        
        wget -q -O runsc "${URL}/runsc"
        wget -q -O containerd-shim-runsc-v1 "${URL}/containerd-shim-runsc-v1"
        echo "${EXPECTED_SHA} runsc" | sha512sum -c -
        
        chmod a+rx runsc containerd-shim-runsc-v1
        sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/
        
        if [[ -d "/sys/kernel/security/apparmor" ]] && command -v apparmor_parser &> /dev/null; then
           cat <<EOF | sudo tee /etc/apparmor.d/usr.local.bin.runsc
        abi <abi/4.0>,
        include <tunables/global>
        /usr/local/bin/runsc flags=(unconfined) {
          userns,
          include if exists <local/usr.local.bin.runsc>
        }
        EOF
           sudo apparmor_parser -r /etc/apparmor.d/usr.local.bin.runsc || true
        fi
        if [[ "$(uname -s)" == "Linux" ]]; then
           sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        
        runsc --version

    - name: Run Semantic Firewall
      id: run-sfw
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_SIGNATURES: ${{ inputs.signatures }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_SCAN_DEPS: ${{ inputs.scan-deps }}
        INPUT_DEPS_DEPTH: ${{ inputs.deps-depth }}
        INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
        SFW_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_BASE: ${{ inputs.api-base }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PREP_BASE_SHA: ${{ steps.prep.outputs.base_sha }}
        PREP_WORKTREE_DIR: ${{ steps.prep.outputs.worktree_dir }}
        PREP_PAIRS_FILE: ${{ steps.prep.outputs.pairs_file }}
        PREP_PAIR_COUNT: ${{ steps.prep.outputs.pair_count }}
        PREP_GITLINKS_FILE: ${{ steps.prep.outputs.gitlinks_file }}
        PREP_GITLINK_COUNT: ${{ steps.prep.outputs.gitlink_count }}
        PREP_HAS_MOD_CHANGES: ${{ steps.prep.outputs.has_mod_changes }}
      run: |
        set -euo pipefail

        # The log runs workflow commands (::error::, ::add-mask::,
        # ::stop-commands:: and the rest), and much of what this step
        # prints comes from the change being analyzed: file names, sfw's
        # output, the LLM's. gh_msg escapes a command's message, so a
        # newline can't end it and start another; raw_log prints its input
        # with commands stopped, behind a token nobody can predict.
        gh_msg() { local s="$1"; s=${s//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}; printf '%s' "$s"; }
        is_go_path() { [[ "$1" == *.go ]]; }
        gh_prop() { local s; s=$(gh_msg "$1"); s=${s//:/%3A}; s=${s//,/%2C}; printf '%s' "$s"; }
        TOKEN=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        [[ ${#TOKEN} -eq 32 ]] || { echo "::error::Cannot read /dev/urandom."; exit 1; }
        # The input may not end in a newline; the resume token must start
        # a line of its own.
        raw_log() { echo "::stop-commands::${TOKEN}"; cat; echo; echo "::${TOKEN}::"; }

        # Plain assignments: readonly X=$(...) hides a failure from set -e.
        TARGET_ABS=$(realpath -m "${INPUT_PATH:-.}")
        BASE_ABS=$(realpath -m ".")
        REL_PATH=$(realpath -m --relative-to="$BASE_ABS" "$TARGET_ABS")

        if [[ "$REL_PATH" == ".."* ]] || [[ "$REL_PATH" == /* ]]; then
           echo "::error::Security Violation: Path Traversal"
           exit 1
        fi
        readonly TARGET_PATH="./${REL_PATH}"

        if [[ ! -e "$TARGET_PATH" ]]; then
          echo "::error::Target path not found: $(gh_msg "$TARGET_PATH")"
          exit 1
        fi

        # Anything but true or false is a mistake, not a quiet "off".
        case "${INPUT_FAIL_ON_ALERT:-true}" in
          true|false) FAIL_ON_ALERT="${INPUT_FAIL_ON_ALERT:-true}" ;;
          *) echo "::error::fail-on-alert must be true or false, not '$(gh_msg "$INPUT_FAIL_ON_ALERT")'."; exit 1 ;;
        esac

        EXIT_CODE=0
        # Outside the checkout, whose paths the analyzed change controls.
        LOCAL_TEMP=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/sfw-run.XXXXXXXX")
        cleanup() {
          rm -rf "$LOCAL_TEMP" 2>/dev/null || true
        }
        trap cleanup EXIT INT TERM

        # diff, audit and deps need the base the prepare step resolved;
        # without it there is nothing to compare, which is not a pass.
        case "$INPUT_MODE" in
          diff|audit|deps)
            if [[ -z "${PREP_BASE_SHA:-}" ]] || [[ ! -d "${PREP_WORKTREE_DIR:-}" ]] || [[ ! -f "${PREP_PAIRS_FILE:-}" ]] || [[ ! "${PREP_PAIR_COUNT:-}" =~ ^[0-9]+$ ]] ||
               [[ ! -f "${PREP_GITLINKS_FILE:-}" ]] || [[ ! "${PREP_GITLINK_COUNT:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::The prepare step did not resolve a base to compare with; nothing was analyzed."
              exit 1
            fi
            WORKTREE_DIR="$PREP_WORKTREE_DIR"
            PAIRS_FILE="$PREP_PAIRS_FILE"
            PAIR_COUNT="$PREP_PAIR_COUNT"
            GITLINKS_FILE="$PREP_GITLINKS_FILE"
            GITLINK_COUNT="$PREP_GITLINK_COUNT"
            ;;
        esac

        case "$INPUT_MODE" in
          check)
            STRICT_FLAG=""
            if [[ "$INPUT_STRICT" == "true" ]]; then STRICT_FLAG="--strict"; fi
            OUTPUT=$(sfw check $STRICT_FLAG -- "$TARGET_PATH")
            printf '%s\n' "$OUTPUT" | raw_log
            ;;

          diff)
            # One sfw run diffs every pair, loading each tree's packages once.
            HIGH_RISK=0
            # Unset when sfw gave no usable result: the count is then unknown.
            DIFF_OK=true
            LEVEL=warning
            if [[ "$FAIL_ON_ALERT" == "true" ]]; then LEVEL=error; fi
            if [[ $PAIR_COUNT -eq 0 ]]; then
              OUTPUT="[]"
              echo "semantic-match-pct=100.0" >> "$GITHUB_OUTPUT"
            else
              # sfw prints one result per pair and exits non-zero after
              # printing when a pair could not be diffed; that pair's entry
              # carries the reason in "error". Keep stderr (warnings such as
              # the runsc fallback notice) out of OUTPUT, which is parsed.
              DIFF_ERR="$LOCAL_TEMP/sfw_diff_stderr.log"
              set +e
              OUTPUT=$(sfw diff --non-go --batch "$PAIRS_FILE" 2>"$DIFF_ERR")
              SFW_RC=$?
              set -e
              # One JSON array, one result per pair: -s, because jq alone
              # reads several documents in a row and judges each.
              if ! printf '%s' "$OUTPUT" | jq -s -e 'length == 1 and (.[0] | type == "array" and length == '"$PAIR_COUNT"')' >/dev/null 2>&1; then
                echo "::error::sfw diff produced no result for the ${PAIR_COUNT} changed file(s)"
                raw_log < "$DIFF_ERR"
                OUTPUT="[]"
                echo "semantic-match-pct=0.0" >> "$GITHUB_OUTPUT"
                DIFF_OK=false
                EXIT_CODE=1
              else
                # Results name the base side by its path in the repository,
                # not in the scratch worktree. A file the build doesn't use
                # (docs, configuration) gives an empty result, left out.
                OUTPUT=$(echo "$OUTPUT" | jq --arg wt "$WORKTREE_DIR/" 'map(.old_file |= ltrimstr($wt) | if (.error | type) == "string" then .error |= (split($wt) | join("")) else . end)
                  | map(select(((.functions // []) | length) > 0 or ((.unanalyzed // []) | length) > 0 or (.error // "") != ""))')
                echo "$OUTPUT" | jq -r 'def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                  .[] | select((.error // "") != "")
                  | "::warning::sfw diff failed for \(if .new_file == "/dev/null" then .old_file else .new_file end | esc): \(.error | esc)"'
                ERROR_COUNT=$(echo "$OUTPUT" | jq '[.[] | select((.error // "") != "")] | length')
                # The mean over the files that have functions to match.
                FUNC_FILES=$(echo "$OUTPUT" | jq '[.[] | select((.summary.total_functions // 0) > 0)] | length')
                if [[ $FUNC_FILES -eq 0 ]]; then
                  AVG_PCT="100.0"
                else
                  TOTAL_MATCH_PCT=$(echo "$OUTPUT" | jq '[.[] | select((.summary.total_functions // 0) > 0) | .summary.semantic_match_pct // 0] | add')
                  AVG_PCT=$(echo "scale=1; $TOTAL_MATCH_PCT / $FUNC_FILES" | bc)
                fi
                echo "semantic-match-pct=${AVG_PCT}" >> "$GITHUB_OUTPUT"

                # A file that could not be analyzed is not a passing file,
                # and neither is a run that failed without saying which.
                if [[ $ERROR_COUNT -gt 0 ]]; then
                  echo "::error::sfw diff failed for ${ERROR_COUNT} file(s)"
                  EXIT_CODE=1
                elif [[ $SFW_RC -ne 0 ]]; then
                  echo "::error::sfw diff exited with status ${SFW_RC}"
                  raw_log < "$DIFF_ERR"
                  EXIT_CODE=1
                fi

                HIGH_RISK=$(echo "$OUTPUT" | jq '[.[] | .summary.high_risk_changes // 0] | add // 0')
                # One annotation per high-risk change, on its file.
                echo "$OUTPUT" | jq -r --arg level "$LEVEL" 'def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                  def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
                  .[] | (if .new_file == "/dev/null" then .old_file else .new_file end) as $f
                  | ((.functions // [])[] | select((.risk_score // 0) >= 10)
                      | "::\($level) file=\($f | prop)::\(.function | esc) \(.status), risk \(.risk_score)\(if (.topology_delta // "") != "" then ": " + (.topology_delta | esc) else "" end)"),
                    ((.unanalyzed // [])[] | select((.risk_score // 0) >= 10)
                      | "::\($level) file=\($f | prop)::\(.kind | esc) \(.change | esc), risk \(.risk_score)")'
              fi
            fi
            if [[ ! "$HIGH_RISK" =~ ^[0-9]+$ ]]; then
              echo "::error::sfw diff gave no high-risk count."
              exit 1
            fi
            while IFS= read -r -d '' -u 3 g; do
              echo "::${LEVEL} file=$(gh_prop "$g")::Submodule changed; sfw cannot analyze the code it brings in."
            done 3< "$GITLINKS_FILE"
            HIGH_RISK=$((HIGH_RISK + GITLINK_COUNT))
            if [[ "$DIFF_OK" == true ]]; then
              echo "high-risk-changes=${HIGH_RISK}" >> "$GITHUB_OUTPUT"
            fi
            if [[ $HIGH_RISK -gt 0 ]]; then
              if [[ "$FAIL_ON_ALERT" == "true" ]]; then
                echo "::error::${HIGH_RISK} high-risk change(s)"
                EXIT_CODE=1
              else
                echo "::warning::${HIGH_RISK} high-risk change(s)"
              fi
            fi
            ;;

          deps)
            if [[ "${PREP_HAS_MOD_CHANGES:-false}" != "true" ]]; then
              OUTPUT='{}'
              echo "high-risk-changes=0" >> "$GITHUB_OUTPUT"
            else
              readonly OLD_ROOT="$WORKTREE_DIR/$REL_PATH"
              if [[ ! -f "$TARGET_PATH/go.mod" ]] || [[ ! -f "$OLD_ROOT/go.mod" ]]; then
                echo "::error::deps mode needs 'path' to be a module root (a directory with go.mod) in both revisions."
                exit 1
              fi
              # sfw loads with GOPROXY=off, so fetch both build lists first.
              # Downloading only fetches and verifies module zips against
              # go.sum; it runs no code. Each tree builds with the go.work
              # above it, but the search stops at the tree's root (a .git
              # entry), as sfw's does.
              governing_work() {
                local d
                d=$(cd "$1" && pwd)
                while :; do
                  if [[ -f "$d/go.work" ]]; then printf '%s' "$d/go.work"; return; fi
                  if [[ -e "$d/.git" ]] || [[ "$d" == "/" ]]; then printf 'off'; return; fi
                  d=$(dirname "$d")
                done
              }
              for root in "$OLD_ROOT" "$TARGET_PATH"; do
                work=$(governing_work "$root")
                if ! (cd "$root" && GOWORK="$work" go mod download) 2>&1 | raw_log; then
                  echo "::error::go mod download failed in $(gh_msg "$root")"
                  exit 1
                fi
              done
              DEPS_ERR="$LOCAL_TEMP/sfw_deps_stderr.log"
              if ! OUTPUT=$(sfw deps diff -- "$OLD_ROOT" "$TARGET_PATH" 2>"$DEPS_ERR"); then
                raw_log < "$DEPS_ERR"
                echo "::error::sfw deps diff failed"
                exit 1
              fi
              printf '%s\n' "$OUTPUT" | raw_log
              HIGH_RISK=$(printf '%s' "$OUTPUT" | jq -s -r 'if length == 1 then .[0].summary.high_risk_changes // 0 else "" end' 2>/dev/null || true)
              if [[ ! "$HIGH_RISK" =~ ^[0-9]+$ ]]; then
                echo "::error::sfw deps diff gave no high-risk count."
                exit 1
              fi
              echo "high-risk-changes=${HIGH_RISK}" >> "$GITHUB_OUTPUT"
              if [[ "$HIGH_RISK" -gt 0 ]]; then
                echo "::warning::${HIGH_RISK} high-risk dependency change(s)"
                if [[ "$FAIL_ON_ALERT" == "true" ]]; then
                  EXIT_CODE=1
                fi
              fi
            fi
            ;;

          scan)
            DEPS_ARGS=()
            if [[ "${INPUT_SCAN_DEPS:-false}" == "true" ]]; then
              DEPS_ARGS+=("--deps")
              DEPS_ARGS+=("--deps-depth" "${INPUT_DEPS_DEPTH:-direct}")
            fi

            if [[ -z "${INPUT_SIGNATURES:-}" ]]; then
              echo "::error::Scan mode requires 'signatures'."
              exit 1
            fi
            
            # Keep the .json suffix: sfw selects the JSON backend by it and
            # would otherwise open a JSON signature file as a PebbleDB directory.
            if [[ "$INPUT_SIGNATURES" == *.json ]]; then
              readonly TEMP_DB="$LOCAL_TEMP/sfw_sigs_copy.json"
            else
              readonly TEMP_DB="$LOCAL_TEMP/sfw_sigs_copy.db"
            fi
            cp -R "$INPUT_SIGNATURES" "$TEMP_DB"
            
            SCAN_STDERR_FILE="$LOCAL_TEMP/sfw_scan_stderr.log"
            if ! OUTPUT=$(sfw scan --db "$TEMP_DB" --threshold "${INPUT_THRESHOLD:-0.75}" "${DEPS_ARGS[@]}" -- "$TARGET_PATH" 2>"$SCAN_STDERR_FILE"); then
              raw_log < "$SCAN_STDERR_FILE"
              exit 1
            fi
            if [[ -s "$SCAN_STDERR_FILE" ]]; then raw_log < "$SCAN_STDERR_FILE"; fi
            printf '%s\n' "$OUTPUT" | raw_log

            ALERT_COUNT=$(printf '%s' "$OUTPUT" | jq -s -r 'if length == 1 then .[0].summary.total_alerts // 0 else "" end' 2>/dev/null || true)
            DEPS_SCANNED=$(printf '%s' "$OUTPUT" | jq -s -r 'if length == 1 then .[0].dependencies_scanned // 0 else "" end' 2>/dev/null || true)
            if [[ ! "$ALERT_COUNT" =~ ^[0-9]+$ ]] || [[ ! "$DEPS_SCANNED" =~ ^[0-9]+$ ]]; then
              echo "::error::sfw scan gave no alert count."
              exit 1
            fi
            echo "alert-count=${ALERT_COUNT}" >> "$GITHUB_OUTPUT"
            echo "deps-scanned=${DEPS_SCANNED}" >> "$GITHUB_OUTPUT"

            if [[ "$FAIL_ON_ALERT" == "true" ]] && [[ "$ALERT_COUNT" -gt 0 ]]; then
              EXIT_CODE=1
            fi
            ;;

          audit)
            # sfw resolves the audit API key from ANTHROPIC_API_KEY,
            # GEMINI_API_KEY or OPENAI_API_KEY (selected by the model name) --
            # it never reads SFW_API_KEY. Re-export the supplied key under the
            # name the CLI actually consumes.
            if [[ -n "${SFW_API_KEY:-}" ]]; then
              case "${INPUT_MODEL,,}" in
                claude*|"") export ANTHROPIC_API_KEY="$SFW_API_KEY" ;;
                gemini*)    export GEMINI_API_KEY="$SFW_API_KEY" ;;
                *)          export OPENAI_API_KEY="$SFW_API_KEY" ;;
              esac
            fi
            AUDIT_FAILS=0
            AUDIT_PASS=0
            NON_GO_FAILS=0
            if [[ $PAIR_COUNT -gt 0 ]]; then
              # The model reads Go. Files the build uses that are not Go go
              # to sfw diff --non-go, and any high-risk one fails the audit.
              NON_GO_PAIRS="$LOCAL_TEMP/non_go_pairs.bin"
              : > "$NON_GO_PAIRS"
              NON_GO_COUNT=0
              if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" || "${GITHUB_EVENT_NAME:-}" == "pull_request_target" ]]; then
                 COMMIT_MSG="${PR_TITLE:-Untitled PR}
            ${PR_BODY:-No description provided}"
              else
                 COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "No commit message")
              fi

              # The pairs come in on fd 3, so nothing sfw does with stdin
              # can eat them.
              while IFS= read -r -d '' -u 3 OLD_FILE && IFS= read -r -d '' -u 3 NEW_FILE; do
                if ! is_go_path "$OLD_FILE" && ! is_go_path "$NEW_FILE"; then
                   printf '%s\0%s\0' "$OLD_FILE" "$NEW_FILE" >> "$NON_GO_PAIRS"
                   NON_GO_COUNT=$((NON_GO_COUNT + 1))
                   continue
                fi
                # An absent side is an empty file: a deleted file's checks
                # are gone too.
                if [[ "$OLD_FILE" == /dev/null ]]; then
                   OLD_FILE=$(mktemp -p "$LOCAL_TEMP" "empty_XXXXXX.go")
                fi
                if [[ "$NEW_FILE" == /dev/null ]]; then
                   NEW_FILE=$(mktemp -p "$LOCAL_TEMP" "empty_XXXXXX.go")
                fi

                # Flags must precede the positional arguments: Go's flag
                # parser stops at the first non-flag argument.
                AUDIT_ARGS=("--model" "${INPUT_MODEL:-claude-opus-5-5}")
                if [[ -n "${INPUT_API_BASE:-}" ]]; then
                   AUDIT_ARGS+=("--api-base" "$INPUT_API_BASE")
                fi
                AUDIT_ARGS+=("--" "$OLD_FILE" "$NEW_FILE" "$COMMIT_MSG")

                set +e
                AUDIT_OUT=$(sfw audit "${AUDIT_ARGS[@]}" 2>&1)
                CMD_EXIT=$?
                set -e
                
                printf '%s\n' "$AUDIT_OUT" | raw_log

                if [[ $CMD_EXIT -ne 0 ]]; then
                   ((AUDIT_FAILS++)) || true
                   EXIT_CODE=1
                else
                   ((AUDIT_PASS++)) || true
                fi
              done 3< "$PAIRS_FILE"

              if [[ $NON_GO_COUNT -gt 0 ]]; then
                NON_GO_ERR="$LOCAL_TEMP/sfw_non_go_stderr.log"
                set +e
                NON_GO_OUT=$(sfw diff --non-go --batch "$NON_GO_PAIRS" 2>"$NON_GO_ERR")
                NON_GO_RC=$?
                set -e
                if [[ $NON_GO_RC -ne 0 ]] || ! printf '%s' "$NON_GO_OUT" | jq -s -e 'length == 1 and (.[0] | type == "array" and length == '"$NON_GO_COUNT"')' >/dev/null 2>&1; then
                  echo "::error::sfw could not check the ${NON_GO_COUNT} changed non-Go file(s)"
                  raw_log < "$NON_GO_ERR"
                  NON_GO_FAILS=$NON_GO_COUNT
                else
                  NON_GO_FAILS=$(printf '%s' "$NON_GO_OUT" | jq '[.[] | select((.summary.high_risk_changes // 0) > 0)] | length')
                  printf '%s' "$NON_GO_OUT" | jq -r --arg wt "$WORKTREE_DIR/" 'def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                    def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
                    .[] | (if .new_file == "/dev/null" then .old_file | ltrimstr($wt) else .new_file end) as $f
                    | (.unanalyzed // [])[] | select((.risk_score // 0) >= 10)
                    | "::error file=\($f | prop)::\(.kind | esc) \(.change | esc), risk \(.risk_score): the audit cannot read it"'
                fi
                if [[ $NON_GO_FAILS -gt 0 ]]; then EXIT_CODE=1; fi
              fi
            fi

            # The audit can't read a submodule's change, so it doesn't pass.
            while IFS= read -r -d '' -u 3 g; do
              echo "::error file=$(gh_prop "$g")::Submodule changed; the audit cannot read the code it brings in."
            done 3< "$GITLINKS_FILE"
            if [[ $GITLINK_COUNT -gt 0 ]]; then EXIT_CODE=1; fi

            if [[ $PAIR_COUNT -eq 0 && $GITLINK_COUNT -eq 0 ]]; then
              echo "audit-verdict=PASS" >> "$GITHUB_OUTPUT"
              OUTPUT="Audit Passed. (No files to audit)"
            elif [[ $AUDIT_FAILS -eq 0 && $GITLINK_COUNT -eq 0 && $NON_GO_FAILS -eq 0 ]]; then
              echo "audit-verdict=PASS" >> "$GITHUB_OUTPUT"
              OUTPUT="Audit Passed. (${AUDIT_PASS} file(s) verified)"
            else
              echo "audit-verdict=FAIL" >> "$GITHUB_OUTPUT"
              OUTPUT="Audit Failed. (${AUDIT_FAILS} deception(s) detected, ${NON_GO_FAILS} non-Go and ${GITLINK_COUNT} submodule change(s) not audited)"
            fi
            ;;
          *)
            echo "::error::Unknown mode."
            EXIT_CODE=1
            ;;
        esac

        # A line equal to the delimiter would end result early and could set
        # other outputs after it.
        DELIM="EOF_SFW_${TOKEN}"
        if printf '%s\n' "$OUTPUT" | grep -qxF "$DELIM"; then
          echo "::error::The result contains its own delimiter."
          exit 1
        fi
        {
          echo "result<<${DELIM}"
          printf '%s\n' "$OUTPUT"
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE

    - name: Cleanup Analysis Environment
      if: always()
      shell: bash
      env:
        WORKTREE_DIR: ${{ steps.prep.outputs.worktree_dir }}
        WORK_DIR: ${{ steps.prep.outputs.work_dir }}
      run: |
        set +e
        if [[ -n "${WORKTREE_DIR:-}" ]] && [[ -d "$WORKTREE_DIR" ]]; then
          git worktree remove --force "$WORKTREE_DIR" 2>/dev/null
        fi
        if [[ -n "${WORK_DIR:-}" ]]; then
          rm -rf "$WORK_DIR"
        fi
        git worktree prune 2>/dev/null || true
