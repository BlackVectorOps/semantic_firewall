# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Semantic Firewall'
description: 'Behavioral analysis engine for Go. Detects malware, proves loop equivalence, and enforces semantic immutability.'
author: 'BlackVectorOps'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to file or directory to analyze'
    required: false
    default: '.'
  mode:
    description: 'Operation mode: check, diff, deps, scan, or audit'
    required: false
    default: 'check'
  go-version:
    description: 'Go version to use (sfw v7 requires Go 1.27.2+)'
    required: false
    default: '1.27'
  signatures:
    description: 'Path to signature database (scan mode only). Required for scan mode.'
    required: false
    default: ''
  threshold:
    description: 'Match confidence threshold 0.0-1.0 (scan mode only)'
    required: false
    default: '0.75'
  strict:
    description: 'Enable strict mode validation (check mode only)'
    required: false
    default: 'false'
  fail-on-alert:
    description: 'Fail workflow if malware is detected (scan mode) or a dependency change is high-risk (deps mode)'
    required: false
    default: 'true'
  scan-deps:
    description: 'Scan imported dependencies (scan mode only)'
    required: false
    default: 'false'
  deps-depth:
    description: 'Dependency scan depth: direct or transitive (scan mode only)'
    required: false
    default: 'direct'
  api-key:
    description: 'LLM API Key (audit mode only). Required for intent verification.'
    required: false
  model:
    description: 'LLM model to use (audit mode only): claude-* (default), gpt-*, or gemini-*. The api-key must belong to that provider.'
    required: false
    default: 'claude-opus-5-5'
  api-base:
    description: 'Custom LLM API Base URL (audit mode only).'
    required: false

outputs:
  result:
    description: 'JSON output from the selected mode'
    value: ${{ steps.run-sfw.outputs.result }}
  alert-count:
    description: 'Number of malware alerts (scan mode)'
    value: ${{ steps.run-sfw.outputs.alert-count }}
  deps-scanned:
    description: 'Number of dependency functions scanned (scan mode with --deps)'
    value: ${{ steps.run-sfw.outputs.deps-scanned }}
  semantic-match-pct:
    description: 'Semantic match percentage (diff mode)'
    value: ${{ steps.run-sfw.outputs.semantic-match-pct }}
  audit-verdict:
    description: 'Final audit verdict (audit mode): PASS or FAIL'
    value: ${{ steps.run-sfw.outputs.audit-verdict }}
  high-risk-changes:
    description: 'Number of high-risk dependency changes (deps mode)'
    value: ${{ steps.run-sfw.outputs.high-risk-changes }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    # IMPORTANT: Caller must use actions/checkout with fetch-depth: 0 for diff/audit/deps modes
    - name: Validate Checkout Depth
      if: ${{ inputs.mode == 'diff' || inputs.mode == 'audit' || inputs.mode == 'deps' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "::error::Insufficient git history. Please use 'actions/checkout' with 'fetch-depth: 0' for diff/audit/deps modes."
          exit 1
        fi

    - name: Install sfw
      shell: bash
      env:
        SFW_VERSION: "v7.1.1"
      run: |
        set -euo pipefail
        
        if command -v sfw &>/dev/null; then
          echo "::notice::sfw already installed: $(sfw version 2>/dev/null || echo 'version unknown')"
          exit 0
        fi
        
        echo "::notice::Installing sfw ${SFW_VERSION}..."
        
        MAX_RETRIES=3
        RETRY_DELAY=5
        
        for attempt in $(seq 1 $MAX_RETRIES); do
          if go install "github.com/BlackVectorOps/semantic_firewall/v7/cmd/sfw@${SFW_VERSION}"; then
            break
          fi
          
          if [[ $attempt -eq $MAX_RETRIES ]]; then
            echo "::error::Failed to install sfw after ${MAX_RETRIES} attempts."
            exit 1
          fi
          sleep $RETRY_DELAY
        done
        
        if ! command -v sfw &>/dev/null; then
          echo "::error::sfw binary not found in PATH after installation."
          exit 1
        fi

    - name: Prepare Analysis Environment
      id: prep
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        
        if [[ "$INPUT_MODE" != "diff" ]] && [[ "$INPUT_MODE" != "audit" ]] && [[ "$INPUT_MODE" != "deps" ]]; then
          echo "mode_needs_prep=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        echo "mode_needs_prep=true" >> "$GITHUB_OUTPUT"
        
        determine_base_ref() {
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            for attempt in 1 2 3; do
              if git fetch origin "$GITHUB_BASE_REF" --depth=100 2>/dev/null; then
                break
              fi
              [[ $attempt -lt 3 ]] && sleep 2
            done
            printf '%s' "origin/$GITHUB_BASE_REF"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            local before_sha="${GITHUB_EVENT_BEFORE:-}"
            if [[ "$before_sha" == "0000000000000000000000000000000000000000" ]] || [[ -z "$before_sha" ]]; then
              printf '%s' "HEAD^"
            else
              printf '%s' "$before_sha"
            fi
          else
            printf '%s' "HEAD~1"
          fi
        }
        
        readonly BASE_REF=$(determine_base_ref)
        readonly HEAD_REF="HEAD"
        echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
        
        readonly WORKTREE_DIR=".sfw_base_worktree"
        if [[ -d "$WORKTREE_DIR" ]]; then
          git worktree remove --force "$WORKTREE_DIR" 2>/dev/null || rm -rf "$WORKTREE_DIR"
        fi
        
        if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
          git fetch --unshallow 2>/dev/null || git fetch --depth=500 2>/dev/null || true
        fi
        
        if git worktree add --detach "$WORKTREE_DIR" "$BASE_REF" >/dev/null 2>&1; then
          echo "::debug::Worktree created successfully."
        else
          mkdir -p "$WORKTREE_DIR"
        fi
        echo "worktree_dir=${WORKTREE_DIR}" >> "$GITHUB_OUTPUT"
        
        readonly DIFF_STREAM_FILE=".sfw_diff_stream.bin"
        if ! git diff -z --name-status "$BASE_REF" "$HEAD_REF" > "$DIFF_STREAM_FILE" 2>/dev/null; then
          : > "$DIFF_STREAM_FILE"
        fi
        
        # grep -c prints 0 and exits 1 when nothing matches; `|| true` keeps
        # that single 0 instead of appending a second one.
        GO_FILE_COUNT=$(git diff --name-only "$BASE_REF" "$HEAD_REF" 2>/dev/null | grep -c '\.go$' || true)
        # A go.work redirects modules like a replace does, so its changes
        # count too.
        MOD_FILE_COUNT=$(git diff --name-only "$BASE_REF" "$HEAD_REF" 2>/dev/null | grep -cE '(^|/)go\.(mod|sum|work|work\.sum)$' || true)
        if [[ "$MOD_FILE_COUNT" -gt 0 ]]; then
          echo "has_mod_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_mod_changes=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$GO_FILE_COUNT" -gt 0 ]]; then
          echo "has_go_files=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_go_files=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install gVisor (runsc)
      shell: bash
      run: |
        set -e
        if command -v runsc &> /dev/null; then
          exit 0
        fi
        GVISOR_VERSION="20260126.0"
        ARCH=$(uname -m)
        URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_VERSION}/${ARCH}"
        EXPECTED_SHA="cce974fa832c50d26c6ccc08ce50b4972921cd0818ebe8007587211d360cbc828ceea4ec8296703200afa208b679437d24f27a6dca31887b3c0fc6ee8be5eb05"
        
        wget -q -O runsc "${URL}/runsc"
        wget -q -O containerd-shim-runsc-v1 "${URL}/containerd-shim-runsc-v1"
        echo "${EXPECTED_SHA} runsc" | sha512sum -c -
        
        chmod a+rx runsc containerd-shim-runsc-v1
        sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/
        
        if [[ -d "/sys/kernel/security/apparmor" ]] && command -v apparmor_parser &> /dev/null; then
           cat <<EOF | sudo tee /etc/apparmor.d/usr.local.bin.runsc
        abi <abi/4.0>,
        include <tunables/global>
        /usr/local/bin/runsc flags=(unconfined) {
          userns,
          include if exists <local/usr.local.bin.runsc>
        }
        EOF
           sudo apparmor_parser -r /etc/apparmor.d/usr.local.bin.runsc || true
        fi
        if [[ "$(uname -s)" == "Linux" ]]; then
           sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        
        runsc --version

    - name: Run Semantic Firewall
      id: run-sfw
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_SIGNATURES: ${{ inputs.signatures }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_SCAN_DEPS: ${{ inputs.scan-deps }}
        INPUT_DEPS_DEPTH: ${{ inputs.deps-depth }}
        INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
        SFW_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_BASE: ${{ inputs.api-base }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PREP_WORKTREE_DIR: ${{ steps.prep.outputs.worktree_dir }}
        PREP_HAS_GO_FILES: ${{ steps.prep.outputs.has_go_files }}
        PREP_HAS_MOD_CHANGES: ${{ steps.prep.outputs.has_mod_changes }}
      run: |
        set -euo pipefail
        
        readonly TARGET_ABS=$(realpath -m "${INPUT_PATH:-.}")
        readonly BASE_ABS=$(realpath -m ".")
        readonly REL_PATH=$(realpath -m --relative-to="$BASE_ABS" "$TARGET_ABS")
        
        if [[ "$REL_PATH" == ".."* ]] || [[ "$REL_PATH" == /* ]]; then
           echo "::error::Security Violation: Path Traversal"
           exit 1
        fi
        readonly TARGET_PATH="./${REL_PATH}"

        if [[ ! -e "$TARGET_PATH" ]]; then
          echo "::error::Target path not found: ${TARGET_PATH}"
          exit 1
        fi

        EXIT_CODE=0
        readonly LOCAL_TEMP=".sfw_temp_$$"
        mkdir -p "$LOCAL_TEMP"
        cleanup() {
          rm -rf "$LOCAL_TEMP" 2>/dev/null || true
        }
        trap cleanup EXIT INT TERM

        case "$INPUT_MODE" in
          check)
            STRICT_FLAG=""
            if [[ "$INPUT_STRICT" == "true" ]]; then STRICT_FLAG="--strict"; fi
            OUTPUT=$(sfw check $STRICT_FLAG -- "$TARGET_PATH")
            echo "$OUTPUT"
            ;;

          diff)
            readonly WORKTREE_DIR="${PREP_WORKTREE_DIR:-.sfw_base_worktree}"
            readonly DIFF_STREAM_FILE=".sfw_diff_stream.bin"
            
            if [[ "${PREP_HAS_GO_FILES:-false}" != "true" ]]; then
              OUTPUT="[]"
              echo "semantic-match-pct=100.0" >> "$GITHUB_OUTPUT"
            else
              # Collect every changed file as an old/new pair and diff them in
              # one sfw run, which loads each tree's packages once.
              readonly PAIRS_FILE="$LOCAL_TEMP/sfw_pairs.bin"
              : > "$PAIRS_FILE"
              PAIR_COUNT=0

              while IFS= read -r -d '' status; do
                case "$status" in
                  R*|C*) IFS= read -r -d '' o; IFS= read -r -d '' n; old_rel_path="$o"; new_rel_path="$n" ;;
                  D) IFS= read -r -d '' _; continue ;;
                  *) IFS= read -r -d '' p; old_rel_path="$p"; new_rel_path="$p" ;;
                esac

                [[ "$new_rel_path" != *.go ]] && continue
                [[ "$new_rel_path" == *_test.go ]] && continue
                [[ "$new_rel_path" == *_generated.go ]] && continue
                [[ "$new_rel_path" == vendor/* ]] && continue

                NEW_FILE="$new_rel_path"
                OLD_FILE="$WORKTREE_DIR/$old_rel_path"
                [[ ! -f "$NEW_FILE" ]] && NEW_FILE="/dev/null"
                [[ ! -f "$OLD_FILE" ]] && OLD_FILE="/dev/null"
                [[ "$NEW_FILE" == "/dev/null" && "$OLD_FILE" == "/dev/null" ]] && continue

                printf '%s\0%s\0' "$OLD_FILE" "$NEW_FILE" >> "$PAIRS_FILE"
                ((PAIR_COUNT++)) || true
              done < "$DIFF_STREAM_FILE"

              if [[ $PAIR_COUNT -eq 0 ]]; then
                OUTPUT="[]"
                echo "semantic-match-pct=100.0" >> "$GITHUB_OUTPUT"
              else
                # sfw prints one result per pair and exits non-zero after
                # printing when a pair could not be diffed; that pair's entry
                # carries the reason in "error". Keep stderr (warnings such as
                # the runsc fallback notice) out of OUTPUT, which is parsed.
                DIFF_ERR="$LOCAL_TEMP/sfw_diff_stderr.log"
                set +e
                OUTPUT=$(sfw diff --batch "$PAIRS_FILE" 2>"$DIFF_ERR")
                set -e
                if ! echo "$OUTPUT" | jq -e 'type == "array" and length == '"$PAIR_COUNT" >/dev/null 2>&1; then
                  echo "::error::sfw diff produced no result for the ${PAIR_COUNT} changed file(s)"
                  sed 's/^/  [sfw] /' "$DIFF_ERR" || true
                  OUTPUT="[]"
                  echo "semantic-match-pct=0.0" >> "$GITHUB_OUTPUT"
                  EXIT_CODE=1
                else
                  echo "$OUTPUT" | jq -r '.[] | select((.error // "") != "") | "::warning::sfw diff failed for \(.new_file): \(.error)"'
                  ERROR_COUNT=$(echo "$OUTPUT" | jq '[.[] | select((.error // "") != "")] | length')
                  TOTAL_MATCH_PCT=$(echo "$OUTPUT" | jq '[.[] | .summary.semantic_match_pct // 0] | add')
                  AVG_PCT=$(echo "scale=1; $TOTAL_MATCH_PCT / $PAIR_COUNT" | bc)
                  echo "semantic-match-pct=${AVG_PCT}" >> "$GITHUB_OUTPUT"

                  # A file that could not be analyzed is not a passing file.
                  if [[ $ERROR_COUNT -gt 0 ]]; then
                    echo "::error::sfw diff failed for ${ERROR_COUNT} file(s)"
                    EXIT_CODE=1
                  fi
                fi
              fi
            fi
            ;;

          deps)
            readonly WORKTREE_DIR="${PREP_WORKTREE_DIR:-.sfw_base_worktree}"
            if [[ "${PREP_HAS_MOD_CHANGES:-false}" != "true" ]]; then
              OUTPUT='{}'
              echo "high-risk-changes=0" >> "$GITHUB_OUTPUT"
            else
              readonly OLD_ROOT="$WORKTREE_DIR/$REL_PATH"
              if [[ ! -f "$TARGET_PATH/go.mod" ]] || [[ ! -f "$OLD_ROOT/go.mod" ]]; then
                echo "::error::deps mode needs 'path' to be a module root (a directory with go.mod) in both revisions."
                exit 1
              fi
              # sfw loads with GOPROXY=off, so fetch both build lists first.
              # Downloading only fetches and verifies module zips against
              # go.sum; it runs no code. Each tree builds with the go.work
              # above it, but the search stops at the tree's root (a .git
              # entry), as sfw's does: the base worktree sits inside the
              # head's checkout and must not take its workspace.
              governing_work() {
                local d
                d=$(cd "$1" && pwd)
                while :; do
                  if [[ -f "$d/go.work" ]]; then printf '%s' "$d/go.work"; return; fi
                  if [[ -e "$d/.git" ]] || [[ "$d" == "/" ]]; then printf 'off'; return; fi
                  d=$(dirname "$d")
                done
              }
              for root in "$OLD_ROOT" "$TARGET_PATH"; do
                work=$(governing_work "$root")
                if ! (cd "$root" && GOWORK="$work" go mod download); then
                  echo "::error::go mod download failed in ${root}"
                  exit 1
                fi
              done
              DEPS_ERR="$LOCAL_TEMP/sfw_deps_stderr.log"
              if ! OUTPUT=$(sfw deps diff -- "$OLD_ROOT" "$TARGET_PATH" 2>"$DEPS_ERR"); then
                sed 's/^/  [sfw] /' "$DEPS_ERR" || true
                echo "::error::sfw deps diff failed"
                exit 1
              fi
              echo "$OUTPUT"
              HIGH_RISK=$(echo "$OUTPUT" | jq -r '.summary.high_risk_changes // 0')
              echo "high-risk-changes=${HIGH_RISK}" >> "$GITHUB_OUTPUT"
              if [[ "$HIGH_RISK" -gt 0 ]]; then
                echo "::warning::${HIGH_RISK} high-risk dependency change(s)"
                if [[ "${INPUT_FAIL_ON_ALERT:-true}" == "true" ]]; then
                  EXIT_CODE=1
                fi
              fi
            fi
            ;;

          scan)
            DEPS_ARGS=()
            if [[ "${INPUT_SCAN_DEPS:-false}" == "true" ]]; then
              DEPS_ARGS+=("--deps")
              DEPS_ARGS+=("--deps-depth" "${INPUT_DEPS_DEPTH:-direct}")
            fi

            if [[ -z "${INPUT_SIGNATURES:-}" ]]; then
              echo "::error::Scan mode requires 'signatures'."
              exit 1
            fi
            
            # Keep the .json suffix: sfw selects the JSON backend by it and
            # would otherwise open a JSON signature file as a PebbleDB directory.
            if [[ "$INPUT_SIGNATURES" == *.json ]]; then
              readonly TEMP_DB="$LOCAL_TEMP/sfw_sigs_copy.json"
            else
              readonly TEMP_DB="$LOCAL_TEMP/sfw_sigs_copy.db"
            fi
            cp -R "$INPUT_SIGNATURES" "$TEMP_DB"
            
            SCAN_STDERR_FILE="$LOCAL_TEMP/sfw_scan_stderr.log"
            if ! OUTPUT=$(sfw scan --db "$TEMP_DB" --threshold "${INPUT_THRESHOLD:-0.75}" "${DEPS_ARGS[@]}" -- "$TARGET_PATH" 2>"$SCAN_STDERR_FILE"); then
              cat "$SCAN_STDERR_FILE" || true
              exit 1
            fi
            if [[ -s "$SCAN_STDERR_FILE" ]]; then cat "$SCAN_STDERR_FILE"; fi
            echo "$OUTPUT"

            ALERT_COUNT=$(echo "$OUTPUT" | jq -r '.summary.total_alerts // 0')
            echo "alert-count=${ALERT_COUNT}" >> "$GITHUB_OUTPUT"
            DEPS_SCANNED=$(echo "$OUTPUT" | jq -r '.dependencies_scanned // 0')
            echo "deps-scanned=${DEPS_SCANNED}" >> "$GITHUB_OUTPUT"
            
            if [[ "${INPUT_FAIL_ON_ALERT:-true}" == "true" ]] && [[ "$ALERT_COUNT" -gt 0 ]]; then
              EXIT_CODE=1
            fi
            ;;

          audit)
            # sfw resolves the audit API key from ANTHROPIC_API_KEY,
            # GEMINI_API_KEY or OPENAI_API_KEY (selected by the model name) --
            # it never reads SFW_API_KEY. Re-export the supplied key under the
            # name the CLI actually consumes.
            if [[ -n "${SFW_API_KEY:-}" ]]; then
              case "${INPUT_MODEL,,}" in
                claude*|"") export ANTHROPIC_API_KEY="$SFW_API_KEY" ;;
                gemini*)    export GEMINI_API_KEY="$SFW_API_KEY" ;;
                *)          export OPENAI_API_KEY="$SFW_API_KEY" ;;
              esac
            fi
            readonly WORKTREE_DIR="${PREP_WORKTREE_DIR:-.sfw_base_worktree}"
            readonly DIFF_STREAM_FILE=".sfw_diff_stream.bin"
            
            if [[ "${PREP_HAS_GO_FILES:-false}" != "true" ]]; then
              echo "audit-verdict=PASS" >> "$GITHUB_OUTPUT"
              OUTPUT="Audit Passed. (No Go files changed)"
            else
              AUDIT_FAILS=0
              AUDIT_PASS=0

              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                 COMMIT_MSG="${PR_TITLE:-Untitled PR}
            ${PR_BODY:-No description provided}"
              else
                 COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "No commit message")
              fi

              while IFS= read -r -d '' status; do
                case "$status" in
                  R*|C*)
                     IFS= read -r -d '' old_rel_path
                     IFS= read -r -d '' new_rel_path
                     ;;
                  D)
                     IFS= read -r -d '' _deleted_path
                     continue
                     ;;
                  *)
                     IFS= read -r -d '' path
                     old_rel_path="$path"
                     new_rel_path="$path"
                     ;;
                esac

                [[ "$new_rel_path" != *.go ]] && continue
                [[ "$new_rel_path" == *_test.go ]] && continue
                [[ "$new_rel_path" == *_generated.go ]] && continue
                [[ "$new_rel_path" == vendor/* ]] && continue
                [[ ! -f "$new_rel_path" ]] && continue

                NEW_FILE="$new_rel_path"
                OLD_FILE="$WORKTREE_DIR/$old_rel_path"
                
                if [[ ! -f "$OLD_FILE" ]]; then
                   OLD_FILE=$(mktemp -p "$LOCAL_TEMP" "empty_XXXXXX.go")
                   : > "$OLD_FILE"
                fi

                # Flags must precede the positional arguments: Go's flag
                # parser stops at the first non-flag argument.
                AUDIT_ARGS=("--model" "${INPUT_MODEL:-claude-opus-5-5}")
                if [[ -n "${INPUT_API_BASE:-}" ]]; then
                   AUDIT_ARGS+=("--api-base" "$INPUT_API_BASE")
                fi
                AUDIT_ARGS+=("--" "$OLD_FILE" "$NEW_FILE" "$COMMIT_MSG")

                set +e
                AUDIT_OUT=$(sfw audit "${AUDIT_ARGS[@]}" 2>&1)
                CMD_EXIT=$?
                set -e
                
                echo "$AUDIT_OUT"

                if [[ $CMD_EXIT -ne 0 ]]; then
                   ((AUDIT_FAILS++)) || true
                   EXIT_CODE=1
                else
                   ((AUDIT_PASS++)) || true
                fi
              done < "$DIFF_STREAM_FILE"

              if [[ $AUDIT_FAILS -eq 0 ]]; then
                 echo "audit-verdict=PASS" >> "$GITHUB_OUTPUT"
                 OUTPUT="Audit Passed. (${AUDIT_PASS} file(s) verified)"
              else
                 echo "audit-verdict=FAIL" >> "$GITHUB_OUTPUT"
                 OUTPUT="Audit Failed. (${AUDIT_FAILS} deception(s) detected)"
              fi
            fi
            ;;
          *)
            echo "::error::Unknown mode."
            EXIT_CODE=1
            ;;
        esac

        {
          echo "result<<EOF_SFW_RESULT"
          echo "$OUTPUT"
          echo "EOF_SFW_RESULT"
        } >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE

    - name: Cleanup Analysis Environment
      if: always()
      shell: bash
      env:
        WORKTREE_DIR: ${{ steps.prep.outputs.worktree_dir }}
      run: |
        set +e
        if [[ -n "${WORKTREE_DIR:-}" ]] && [[ -d "$WORKTREE_DIR" ]]; then
          git worktree remove --force "$WORKTREE_DIR" 2>/dev/null || rm -rf "$WORKTREE_DIR"
        fi
        rm -f .sfw_diff_stream.bin 2>/dev/null
        rm -rf .sfw_temp_* 2>/dev/null
        git worktree prune 2>/dev/null || true
